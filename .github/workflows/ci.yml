name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # SolidWorks automation is Windows only. Hosted runners have no SolidWorks, so the integration
    # tests skip themselves and the unit tests run.
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync
      - run: uv run ruff check src tests
      - run: uv run pytest -q
